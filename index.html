<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>코드 산책 · Python 구조 뷰어</title>
<link rel="stylesheet" href="/static/app.css"><header><h1>코드 산책</h1><input type="file" multiple aria-label="코드 파일 추가"><label>폴더 추가 <input id="folder" type="file" webkitdirectory multiple></label><select id="lesson-language" aria-label="학습 예제 언어"><option value="python">Python (주문)</option><option value="python-oop">Python (상속)</option><option value="java">Java (주문)</option></select><button id="lesson">학습 예제</button><button id="save-work">작업 저장</button><label>작업 불러오기<input id="restore-work" type="file" accept=".json"></label></header>
<nav id="explorer"><input id="search" placeholder="파일·클래스·함수 검색" aria-label="이름 검색"><p id="help" role="status">실선: 소속·작성 순서 / 점선: 호출 관계<br>코드를 실행하지 않고 읽는 도구입니다.</p><button id="next-lesson" hidden>다음 단계</button><button id="find-entry">시작점 찾기</button><div id="relations"></div><button id="reset-work">새 작업</button><button id="undo-work" disabled>삭제 되돌리기</button><button id="focus-flow">호출 흐름 집중</button><button id="bookmark">선택 위치 북마크</button><input id="memo-search" aria-label="메모 검색" placeholder="메모 검색"><button id="export-notes">메모 내보내기</button><div id="notes-list"></div><div id="tree"></div></nav><main aria-label="코드 캔버스"><aside><strong>코드 파일을 놓거나 왼쪽 목록에서 파일을 끌어놓으세요</strong>○ 클래스　 ▭ 함수　⬡ 변수　 ·　 최대 5 MiB</aside><article><svg id="edges" width="1" height="1" aria-hidden="true"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#2685c5"/></marker></defs><path fill="none" stroke="#799481" stroke-width="2"/><g id="calls" fill="none" stroke="#2685c5" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/></svg></article></main>
<footer><span id="autosave-status" role="status">자동 저장 준비 중</span><span id="status" role="status">빈 곳을 드래그해 이동 · 휠로 확대 및 축소</span><div><button id="minus" aria-label="축소">−</button> <button id="reset" title="처음 위치와 배율로 복원">100%</button> <button id="plus" aria-label="확대">＋</button></div></footer>
<div id="menu" hidden><button id="add-memo" hidden>메모 추가·열기</button><button id="remove-file">파일을 화면에서 제거</button><button id="remove-folder">폴더 전체를 화면에서 제거</button></div><script src="/static/app.js"></script></html>
