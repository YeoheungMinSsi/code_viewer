function routeAround(start,end,boxes){

 const key=(i,j)=>i+','+j, begin=[xs.indexOf(start.x),ys.indexOf(start.y)],goal=key(xs.indexOf(end.x),ys.indexOf(end.y));
 const queue=[begin],previous=new Map([[key(...begin),null]]);
 for(let n=0;n<queue.length;n++){

 if(!blocked){previous.set(key(u,v),k);queue.push([u,v])}

 }

}
// Keep the file's source column fixed; pack right-hand panels into free space.
function layout(){

 if(!file.open)continue;
 const base=file.getBoundingClientRect(),occupied=[];
 let right=280;
 const rect=el=>{

 };
 const visible=[...file.querySelectorAll('summary')].filter(el=>!el.parentElement.parentElement.closest('details:not([open])'));
 for(const el of visible){
 if(!el.parentElement.closest('.cls[open]>section'))occupied.push(rect(el));
 }
 function place(panel){

 let r=rect(panel),offset=0,hit;
 while((hit=occupied.find(o=>r.x<o.x+o.w+8&&r.x+r.w+8>o.x&&r.y<o.y+o.h+24&&r.y+r.h+24>o.y))){

 }

function redraw(){

function resolveCall(call){

document.querySelector('#focus-flow').onclick=()=>{
 focusedFlow=!focusedFlow;output.querySelectorAll('.study-dim').forEach(n=>n.classList.remove('study-dim'));
 if(!focusedFlow||!selectedStudyNode?.isConnected){focusedFlow=false;return}
 const related=new Set([selectedStudyNode]);for(const call of output.querySelectorAll('.call')){const source=call.closest('details'),target=resolveCall(call);if(source===selectedStudyNode&&target)related.add(target);if(target===selectedStudyNode)related.add(source)}
 for(const node of output.querySelectorAll('.fn,.cls,.entry'))if(!related.has(node)&&![...related].some(n=>node.contains(n)))node.classList.add('study-dim');
};
if(typeof window!=='undefined'){
 for(const [title,ids] of [['학습',['find-entry','focus-flow','bookmark']],['메모',['memo-search','export-notes','notes-list']],['작업 관리',['reset-work','undo-work']]]){const group=document.createElement('fieldset'),legend=document.createElement('legend');group.className='tool-group';legend.textContent=title;group.append(legend);document.querySelector('#explorer').append(group);for(const id of ids)group.append(document.getElementById(id))}
}

let csharpRevision=0;
async function refreshCsharpLinks(){
 const revision=++csharpRevision;
 const files=[...output.querySelectorAll('.file')].filter(f=>f.dataset.language==='csharp'&&sources.has(f));
 if(!files.length)return;
 const sourceMap={};const duplicates=new Set();
 for(const file of files){if(Object.hasOwn(sourceMap,file.dataset.path))duplicates.add(file.dataset.path);sourceMap[file.dataset.path]=sources.get(file)}
 for(const path of duplicates)delete sourceMap[path];
 try{
 const response=await fetch('/csharp-links',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(sourceMap)});
 if(!response.ok)throw Error(await response.text());const result=await response.json();if(revision!==csharpRevision)return;
 for(const file of files)for(const call of file.querySelectorAll('[data-cs-call]')){
 const link=result[file.dataset.path]?.[call.dataset.csCall];const old=call.dataset.target;
 call.dataset.target=link?.target?'@cs:'+JSON.stringify(link.target):'?'+(link?.reason||'같은 경로의 파일이 중복되어 연결할 수 없습니다.');call.title=link?.reason||call.dataset.target.slice(1);
 if(old!==call.dataset.target&&activeCalls.has(call)){activeCalls.delete(call);call.setAttribute('aria-pressed','false')}
 }
 redraw();
 }catch(error){if(revision!==csharpRevision)return;for(const file of files)for(const call of file.querySelectorAll('[data-cs-call]')){call.dataset.target='?'+error.message;call.title=error.message;activeCalls.delete(call);call.setAttribute('aria-pressed','false')}redraw()}
}
</script></html>
